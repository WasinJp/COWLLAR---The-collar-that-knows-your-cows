; COWLLAR — live activity classifier demo
; Target: M5Stack Cardputer Adv (Stamp-S3A / ESP32-S3FN8, BMI270 IMU)
;
; Build:  pio run
; Flash:  pio run -t upload   (device in normal mode, USB-C)
; If upload fails: hold G0/BOOT while plugging in, then retry.

[env:cardputer-adv]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
build_flags =
    -DESP32S3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    m5stack/M5Cardputer@^1.1.0
    m5stack/M5Unified@^0.2.2
    kosme/arduinoFFT@^2.0.4
