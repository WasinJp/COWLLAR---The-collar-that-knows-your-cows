; ============================================================
;  Herd monitor receiver — M5Stack Cardputer (StampS3 inside)
;  pioarduino platform = Arduino core 3.x (ESP-NOW RSSI callback).
; ============================================================

[env:cardputer]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    m5stack/M5Cardputer
