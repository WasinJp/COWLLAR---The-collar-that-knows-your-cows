; ============================================================
;  Ear tag node — ESP32-S3 + LSM6DS3
;  Uses the pioarduino platform build for Arduino core 3.x
;  (needed for the ESP-NOW callback signature + RSSI).
; ============================================================

[env:eartag]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    sparkfun/SparkFun LSM6DS3 Breakout

; If your S3 board is a specific model, you can swap `board =` for it
; (e.g. seeed_xiao_esp32s3, lolin_s3_mini). esp32-s3-devkitc-1 works
; as a generic fallback for most S3 dev boards.
