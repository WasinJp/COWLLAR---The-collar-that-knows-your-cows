; COWLLAR data-collection tag — ESP32-S3 N16R8 (16 MB flash, 8 MB PSRAM)
;
; Build:  pio run
; Flash:  pio run -t upload
; Dump:   python ../tools/dump_tag.py --port /dev/ttyACM0 -o session1.tag
;
; If upload fails: hold BOOT, tap RST, release BOOT, retry.

[env:tag-esp32s3-n16r8]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 921600
monitor_speed = 115200

board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.partitions = partitions_16mb.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1     ; native USB serial, no UART bridge needed
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_SPIRAM_USE_MALLOC=1

lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0
