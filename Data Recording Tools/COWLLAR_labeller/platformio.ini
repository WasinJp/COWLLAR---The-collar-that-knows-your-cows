; COWLLAR labeller — Cardputer Adv stays in YOUR HANDS
; The demo hardware never goes near the cow.
[env:cardputer-adv-labeller]
platform = espressif32@6.7.0
framework = arduino
board = esp32-s3-devkitc-1
upload_speed = 1500000
monitor_speed = 115200
build_flags =
    -DESP32S3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    m5stack/M5Cardputer@^1.1.0
    m5stack/M5Unified@^0.2.2
