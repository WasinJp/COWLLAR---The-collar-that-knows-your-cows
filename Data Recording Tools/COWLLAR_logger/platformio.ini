; COWLLAR — field data logger (raw IMU + human labels -> microSD)
; Target: M5Stack Cardputer Adv (Stamp-S3A / ESP32-S3FN8, BMI270 IMU, microSD)
;
; Build:  pio run
; Flash:  pio run -t upload
; If upload fails: hold G0/BOOT while plugging in, then retry.
;
; This is a SEPARATE firmware from the demo. It does no classification at all —
; it only records raw sensor data plus the label you press, so that thresholds
; can be fitted offline against real cow behaviour.

[env:cardputer-adv-logger]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
build_flags =
    -DESP32S3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    m5stack/M5Cardputer@^1.1.0
    m5stack/M5Unified@^0.2.2
